<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회계 온톨로지 그래프</title>
  <meta name="description" content="회계 계정 온톨로지를 점과 선으로 보고, 입력한 사실과 추론기가 만든 결론을 구분해 확인합니다.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] } } },
    }
  </script>
  <style>
    :root {
      --bg: #09090b;
      --panel: #18181b;
      --panel-core: #111114;
      --line: #3f3f46;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #34d399;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', system-ui, sans-serif;
      word-break: keep-all;
      font-variant-numeric: tabular-nums;
    }
    .mesh {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(60rem 40rem at 85% -10%, rgba(52, 211, 153, 0.07), transparent 60%),
        radial-gradient(50rem 36rem at -10% 110%, rgba(161, 161, 170, 0.06), transparent 60%);
    }
    .bezel { background: rgba(255, 255, 255, 0.04); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08); padding: 6px; border-radius: 2rem; }
    .core {
      background: var(--panel-core); border-radius: calc(2rem - 6px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.10);
    }
    .reveal { opacity: 0; animation: fadeInUp 0.9s var(--ease) forwards; animation-delay: calc(var(--index, 0) * 90ms); }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(1.5rem); filter: blur(4px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @media (prefers-reduced-motion: reduce) { .reveal { animation: none; opacity: 1; } }

    .chip, .switch-row { transition: all 0.5s var(--ease); }
    .chip { text-align: left; }
    .chip:hover { transform: scale(1.01); background: rgba(255, 255, 255, 0.07); }
    .chip:active { transform: scale(0.98); }
    .chip[aria-pressed="true"] { background: rgba(52, 211, 153, 0.12); box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.45); }
    .chip:focus-visible, .switch:focus-visible, .reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .switch { width: 44px; height: 26px; border-radius: 999px; background: #3f3f46; position: relative; transition: background 0.5s var(--ease); flex: none; }
    .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 999px; background: #fafafa; transition: transform 0.5s var(--ease); }
    .switch[aria-checked="true"] { background: #059669; }
    .switch[aria-checked="true"]::after { transform: translateX(18px); }

    /* 그래프 */
    #stage { touch-action: none; cursor: grab; }
    #stage:active { cursor: grabbing; }
    .edge { fill: none; stroke-width: 1.4; transition: opacity 0.5s var(--ease); }
    .edge.fact { stroke: #a1a1aa; }
    .edge.rule { stroke: #52525b; stroke-dasharray: 4 4; }
    .edge.inferred { stroke: var(--accent); stroke-width: 2.2; }
    .node { cursor: pointer; transition: opacity 0.5s var(--ease); }
    .node .shape { transition: stroke 0.5s var(--ease), stroke-width 0.5s var(--ease); }
    .node text { fill: var(--text); font-size: 12.5px; font-weight: 500; pointer-events: none; paint-order: stroke; stroke: #09090b; stroke-width: 4px; stroke-linejoin: round; }
    .node.class text { font-weight: 600; stroke: none; }
    .dim { opacity: 0.14; }
    .edge-label { fill: var(--muted); font-size: 11px; paint-order: stroke; stroke: #09090b; stroke-width: 3px; pointer-events: none; }
    .badge { font-size: 11px; letter-spacing: 0.04em; }
  </style>
</head>
<body class="min-h-[100dvh]">
  <div class="mesh" aria-hidden="true"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 lg:py-12 grid grid-cols-1 lg:grid-cols-[360px_1fr] gap-6 lg:gap-8">

    <!-- 왼쪽: 설명과 조작 -->
    <aside class="flex flex-col gap-6">
      <header class="reveal" style="--index:0">
        <span class="badge inline-flex items-center gap-1.5 rounded-full px-3 py-1 font-medium uppercase" style="background:rgba(52,211,153,.1);color:var(--accent)">
          <iconify-icon icon="solar:graph-new-linear"></iconify-icon> 회계 온톨로지
        </span>
        <h1 class="mt-4 text-3xl font-bold tracking-tight leading-tight">계정이 어떻게<br>분류되는지 눈으로 봅니다</h1>
        <p class="mt-3 text-[15px] leading-relaxed text-zinc-400 max-w-[42ch]">
          회색 선은 내가 입력한 사실이고, 초록 선은 추론기가 규칙을 적용해 찾아낸 결론입니다.
        </p>
      </header>

      <section class="reveal bezel" style="--index:1" aria-label="요약">
        <div class="core p-5 grid grid-cols-3 gap-2 text-center">
          <div><div id="stat-nodes" class="text-2xl font-semibold">0</div><div class="text-xs text-zinc-400 mt-1">점(노드)</div></div>
          <div><div id="stat-facts" class="text-2xl font-semibold">0</div><div class="text-xs text-zinc-400 mt-1">입력한 사실</div></div>
          <div><div id="stat-inferred" class="text-2xl font-semibold" style="color:var(--accent)">0</div><div class="text-xs text-zinc-400 mt-1">추론 결과</div></div>
        </div>
      </section>

      <section class="reveal bezel" style="--index:2" aria-label="추론 결과 표시">
        <div class="core p-5">
          <div class="switch-row flex items-center justify-between gap-4">
            <div>
              <div class="font-semibold">추론 결과 보기</div>
              <div class="text-sm text-zinc-400 mt-1 leading-snug">끄면 추론기를 돌리기 전, 입력한 것만 남습니다.</div>
            </div>
            <button id="toggle-inferred" class="switch" role="switch" aria-checked="true" aria-label="추론 결과 보기"></button>
          </div>
        </div>
      </section>

      <section class="reveal bezel" style="--index:3" aria-label="질문">
        <div class="core p-5">
          <div class="flex items-center justify-between">
            <h2 class="font-semibold">그래프에 질문하기</h2>
            <button id="reset" class="reset hidden items-center gap-1 text-sm text-zinc-400 hover:text-white transition-colors">
              <iconify-icon icon="solar:restart-linear"></iconify-icon> 해제
            </button>
          </div>
          <p class="text-sm text-zinc-400 mt-1">누르면 답에 해당하는 점이 밝아집니다.</p>
          <div id="queries" class="mt-4 flex flex-col gap-2"></div>
        </div>
      </section>

      <section class="reveal bezel" style="--index:4" aria-live="polite" aria-label="선택한 항목">
        <div id="detail" class="core p-5 min-h-[9rem]"></div>
      </section>
    </aside>

    <!-- 오른쪽: 그래프 -->
    <section class="reveal bezel self-start w-full" style="--index:2" aria-label="온톨로지 그래프">
      <div class="core relative overflow-hidden h-[70dvh] min-h-[420px] lg:h-[calc(100dvh-6rem)]">
        <svg id="stage" class="w-full h-full" role="img" aria-label="계정과 개념이 선으로 연결된 그래프"></svg>

        <div class="absolute left-4 bottom-4 rounded-2xl px-4 py-3 text-xs leading-relaxed backdrop-blur-xl" style="background:rgba(9,9,11,.72);box-shadow:0 0 0 1px rgba(255,255,255,.08)">
          <div class="flex items-center gap-2"><span class="inline-block w-6 h-0 border-t-2 border-zinc-400"></span> 입력한 사실</div>
          <div class="flex items-center gap-2 mt-1.5"><span class="inline-block w-6 h-0 border-t-[3px]" style="border-color:var(--accent)"></span> 추론 결과</div>
          <div class="flex items-center gap-2 mt-1.5"><span class="inline-block w-6 h-0 border-t-2 border-dashed border-zinc-600"></span> 규칙(하위 개념)</div>
          <div class="flex items-center gap-2 mt-2.5 text-zinc-400">
            <span class="inline-block w-4 h-3 rounded-[4px] bg-zinc-800 ring-1 ring-zinc-600"></span> 개념
            <span class="inline-block w-3 h-3 rounded-full bg-zinc-200 ml-2"></span> 계정
            <span class="inline-block w-3 h-3 rounded-full bg-zinc-500 ml-2"></span> 그 외
          </div>
        </div>
        <div class="absolute right-4 top-4 flex items-center gap-1.5 text-xs text-zinc-500">
          <iconify-icon icon="solar:hand-shake-linear"></iconify-icon> 끌어서 이동 · 휠로 확대
        </div>
      </div>
    </section>
  </main>

  <script>
    const DATA = {"nodes": [{"id": "Account", "label": "계정", "kind": "class"}, {"id": "Asset", "label": "자산", "kind": "class"}, {"id": "AssociateCompany", "label": "관계기업", "kind": "class"}, {"id": "CurrentAsset", "label": "유동자산", "kind": "class"}, {"id": "CurrentLiability", "label": "유동부채", "kind": "class"}, {"id": "Entity", "label": "거래 상대방", "kind": "class"}, {"id": "Equity", "label": "자본", "kind": "class"}, {"id": "Liability", "label": "부채", "kind": "class"}, {"id": "NonCurrentAsset", "label": "비유동자산", "kind": "class"}, {"id": "NonCurrentLiability", "label": "비유동부채", "kind": "class"}, {"id": "RelatedParty", "label": "특수관계자", "kind": "class"}, {"id": "RelatedPartyAccount", "label": "특수관계자 계정(추가 검토 대상)", "kind": "class"}, {"id": "Subsidiary", "label": "종속회사", "kind": "class"}, {"id": "Term", "label": "기간 구분", "kind": "class"}, {"id": "accounts_payable", "label": "매입채무", "kind": "account"}, {"id": "accounts_receivable", "label": "매출채권", "kind": "account"}, {"id": "ar_associate", "label": "매출채권(관계기업D)", "kind": "account"}, {"id": "associate_d", "label": "관계기업D", "kind": "entity"}, {"id": "bank_c", "label": "은행C", "kind": "entity"}, {"id": "building", "label": "건물", "kind": "account"}, {"id": "cash", "label": "현금", "kind": "account"}, {"id": "customer_a", "label": "거래처A", "kind": "entity"}, {"id": "inventory", "label": "재고자산", "kind": "account"}, {"id": "loan_to_subsidiary", "label": "대여금(자회사B)", "kind": "account"}, {"id": "long_term", "label": "1년 초과", "kind": "term"}, {"id": "long_term_borrowings", "label": "장기차입금", "kind": "account"}, {"id": "prepayment", "label": "선급금", "kind": "account"}, {"id": "share_capital", "label": "자본금", "kind": "account"}, {"id": "short_term", "label": "1년 이내", "kind": "term"}, {"id": "subsidiary_b", "label": "자회사B", "kind": "entity"}, {"id": "tangible_assets", "label": "유형자산", "kind": "account"}], "edges": [{"source": "short_term", "target": "Term", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "long_term", "target": "Term", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "customer_a", "target": "Entity", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "bank_c", "target": "Entity", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "subsidiary_b", "target": "Subsidiary", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "associate_d", "target": "AssociateCompany", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "cash", "target": "Asset", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "accounts_receivable", "target": "Asset", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "loan_to_subsidiary", "target": "Asset", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "ar_associate", "target": "Asset", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "building", "target": "Asset", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "tangible_assets", "target": "Asset", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "inventory", "target": "Asset", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "prepayment", "target": "Asset", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "cash", "target": "CurrentAsset", "relation": "type", "relationLabel": "종류", "status": "inferred"}, {"source": "accounts_receivable", "target": "CurrentAsset", "relation": "type", "relationLabel": "종류", "status": "inferred"}, {"source": "ar_associate", "target": "CurrentAsset", "relation": "type", "relationLabel": "종류", "status": "inferred"}, {"source": "inventory", "target": "CurrentAsset", "relation": "type", "relationLabel": "종류", "status": "inferred"}, {"source": "loan_to_subsidiary", "target": "NonCurrentAsset", "relation": "type", "relationLabel": "종류", "status": "inferred"}, {"source": "building", "target": "NonCurrentAsset", "relation": "type", "relationLabel": "종류", "status": "inferred"}, {"source": "tangible_assets", "target": "NonCurrentAsset", "relation": "type", "relationLabel": "종류", "status": "inferred"}, {"source": "loan_to_subsidiary", "target": "RelatedPartyAccount", "relation": "type", "relationLabel": "종류", "status": "inferred"}, {"source": "ar_associate", "target": "RelatedPartyAccount", "relation": "type", "relationLabel": "종류", "status": "inferred"}, {"source": "accounts_payable", "target": "Liability", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "long_term_borrowings", "target": "Liability", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "accounts_payable", "target": "CurrentLiability", "relation": "type", "relationLabel": "종류", "status": "inferred"}, {"source": "long_term_borrowings", "target": "NonCurrentLiability", "relation": "type", "relationLabel": "종류", "status": "inferred"}, {"source": "share_capital", "target": "Equity", "relation": "type", "relationLabel": "종류", "status": "fact"}, {"source": "Asset", "target": "Account", "relation": "subClassOf", "relationLabel": "하위 개념", "status": "rule"}, {"source": "Liability", "target": "Account", "relation": "subClassOf", "relationLabel": "하위 개념", "status": "rule"}, {"source": "Equity", "target": "Account", "relation": "subClassOf", "relationLabel": "하위 개념", "status": "rule"}, {"source": "RelatedPartyAccount", "target": "Account", "relation": "subClassOf", "relationLabel": "하위 개념", "status": "rule"}, {"source": "RelatedParty", "target": "Entity", "relation": "subClassOf", "relationLabel": "하위 개념", "status": "rule"}, {"source": "Subsidiary", "target": "RelatedParty", "relation": "subClassOf", "relationLabel": "하위 개념", "status": "rule"}, {"source": "AssociateCompany", "target": "RelatedParty", "relation": "subClassOf", "relationLabel": "하위 개념", "status": "rule"}, {"source": "CurrentAsset", "target": "Asset", "relation": "subClassOf", "relationLabel": "하위 개념", "status": "rule"}, {"source": "NonCurrentAsset", "target": "Asset", "relation": "subClassOf", "relationLabel": "하위 개념", "status": "rule"}, {"source": "CurrentLiability", "target": "Liability", "relation": "subClassOf", "relationLabel": "하위 개념", "status": "rule"}, {"source": "NonCurrentLiability", "target": "Liability", "relation": "subClassOf", "relationLabel": "하위 개념", "status": "rule"}, {"source": "cash", "target": "short_term", "relation": "has_term", "relationLabel": "회수 기간", "status": "fact"}, {"source": "accounts_receivable", "target": "short_term", "relation": "has_term", "relationLabel": "회수 기간", "status": "fact"}, {"source": "ar_associate", "target": "short_term", "relation": "has_term", "relationLabel": "회수 기간", "status": "fact"}, {"source": "inventory", "target": "short_term", "relation": "has_term", "relationLabel": "회수 기간", "status": "fact"}, {"source": "accounts_payable", "target": "short_term", "relation": "has_term", "relationLabel": "회수 기간", "status": "fact"}, {"source": "loan_to_subsidiary", "target": "long_term", "relation": "has_term", "relationLabel": "회수 기간", "status": "fact"}, {"source": "building", "target": "long_term", "relation": "has_term", "relationLabel": "회수 기간", "status": "fact"}, {"source": "tangible_assets", "target": "long_term", "relation": "has_term", "relationLabel": "회수 기간", "status": "fact"}, {"source": "long_term_borrowings", "target": "long_term", "relation": "has_term", "relationLabel": "회수 기간", "status": "fact"}, {"source": "accounts_receivable", "target": "customer_a", "relation": "has_counterparty", "relationLabel": "거래 상대방", "status": "fact"}, {"source": "loan_to_subsidiary", "target": "subsidiary_b", "relation": "has_counterparty", "relationLabel": "거래 상대방", "status": "fact"}, {"source": "ar_associate", "target": "associate_d", "relation": "has_counterparty", "relationLabel": "거래 상대방", "status": "fact"}, {"source": "long_term_borrowings", "target": "bank_c", "relation": "has_counterparty", "relationLabel": "거래 상대방", "status": "fact"}], "queries": [{"title": "유동자산 전체", "ids": ["accounts_receivable", "ar_associate", "cash", "inventory"]}, {"title": "특수관계자와 거래한 계정과 그 상대방", "ids": ["ar_associate", "associate_d", "loan_to_subsidiary", "subsidiary_b"]}, {"title": "특수관계자와 거래한 비유동 계정 (두 조건을 한 번에)", "ids": ["loan_to_subsidiary"]}, {"title": "기간 정보가 없어 유동/비유동 분류가 안 된 자산", "ids": ["prepayment"]}]};

    const REL_TEXT = { type: '종류', subClassOf: '하위 개념', has_term: '회수 기간', has_counterparty: '거래 상대방' };
    const KIND_TEXT = { class: '개념(규칙)', account: '계정', entity: '거래 상대방', term: '기간 구분' };
    const STATUS_TEXT = { fact: '입력한 사실', inferred: '추론 결과', rule: '규칙' };

    const nodes = DATA.nodes.map(n => ({ ...n }));
    const byId = new Map(nodes.map(n => [n.id, n]));
    const links = DATA.edges.map(e => ({ ...e }));

    // 개념 노드는 라벨 길이에 맞춘 둥근 사각형, 나머지는 원
    nodes.forEach(n => {
      if (n.kind === 'class') { n.w = n.label.length * 13 + 26; n.h = 30; }
      else { n.r = n.kind === 'account' ? 10 : 8; }
    });
    // 추론 결과로 새 분류를 얻은 개체에는 초록 테두리를 붙인다
    const hasInferred = new Set(links.filter(l => l.status === 'inferred' && l.relation === 'type').map(l => l.source));

    const state = { showInferred: true, activeQuery: null, selected: null };
    const isVisibleLink = l => state.showInferred || l.status !== 'inferred';

    // ── 그리기 준비 ─────────────────────────────
    const svg = d3.select('#stage');
    const root = svg.append('g');
    svg.append('defs').selectAll('marker')
      .data([['fact', '#a1a1aa'], ['rule', '#52525b'], ['inferred', '#34d399']])
      .join('marker')
      .attr('id', d => 'arrow-' + d[0]).attr('viewBox', '0 -5 10 10')
      .attr('refX', 9).attr('refY', 0).attr('markerWidth', 7).attr('markerHeight', 7).attr('orient', 'auto')
      .append('path').attr('d', 'M0,-4L10,0L0,4Z').attr('fill', d => d[1]);

    const linkSel = root.append('g').selectAll('path').data(links).join('path')
      .attr('class', d => 'edge ' + d.status)
      .attr('marker-end', d => `url(#arrow-${d.status})`);

    const edgeLabelSel = root.append('g').selectAll('text').data(links).join('text')
      .attr('class', 'edge-label').attr('text-anchor', 'middle').style('display', 'none')
      .text(d => REL_TEXT[d.relation]);

    const nodeSel = root.append('g').selectAll('g').data(nodes).join('g')
      .attr('class', d => 'node ' + d.kind)
      .attr('tabindex', 0).attr('role', 'button').attr('aria-label', d => d.label)
      .on('click', (event, d) => { event.stopPropagation(); select(d.id); })
      .on('keydown', (event, d) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); select(d.id); } });

    nodeSel.each(function (d) {
      const g = d3.select(this);
      if (d.kind === 'class') {
        g.append('rect').attr('class', 'shape').attr('x', -d.w / 2).attr('y', -d.h / 2)
          .attr('width', d.w).attr('height', d.h).attr('rx', 9)
          .attr('fill', '#27272a').attr('stroke', '#52525b').attr('stroke-width', 1.2);
        g.append('text').attr('text-anchor', 'middle').attr('dy', '0.35em').text(d.label);
      } else {
        g.append('circle').attr('class', 'shape').attr('r', d.r)
          .attr('fill', d.kind === 'account' ? '#e4e4e7' : d.kind === 'entity' ? '#71717a' : '#52525b')
          .attr('stroke', '#09090b').attr('stroke-width', 1.5);
        g.append('text').attr('text-anchor', 'middle').attr('dy', d.r + 15).text(d.label);
      }
    });

    // ── 물리 배치(점끼리 밀고, 선으로 당기는 계산) ─────
    const sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id)
        .distance(l => l.relation === 'subClassOf' ? 120 : l.relation === 'type' ? 170 : 130).strength(0.4))
      .force('charge', d3.forceManyBody().strength(-900))
      // 이름이 긴 점끼리 글자가 겹치지 않도록 이름 길이만큼 자리를 비워 둔다
      .force('collide', d3.forceCollide().radius(d => d.kind === 'class' ? d.w / 2 + 16 : Math.max(d.r + 24, d.label.length * 6.5 + 10)).iterations(3))
      .force('x', d3.forceX().strength(0.03))
      .force('y', d3.forceY().strength(0.05));

    // 선이 점 안쪽까지 파고들지 않도록 가장자리에서 끊는다
    function edgeEnd(from, to, pad) {
      const dx = to.x - from.x, dy = to.y - from.y;
      const dist = Math.hypot(dx, dy) || 1;
      const ux = dx / dist, uy = dy / dist;
      let cut;
      if (to.kind === 'class') cut = Math.min((to.w / 2) / (Math.abs(ux) || 1e-6), (to.h / 2) / (Math.abs(uy) || 1e-6));
      else cut = to.r;
      return [to.x - ux * (cut + pad), to.y - uy * (cut + pad)];
    }
    function edgeStart(from, to) {
      const dx = to.x - from.x, dy = to.y - from.y;
      const dist = Math.hypot(dx, dy) || 1;
      const ux = dx / dist, uy = dy / dist;
      let cut;
      if (from.kind === 'class') cut = Math.min((from.w / 2) / (Math.abs(ux) || 1e-6), (from.h / 2) / (Math.abs(uy) || 1e-6));
      else cut = from.r;
      return [from.x + ux * cut, from.y + uy * cut];
    }

    function ticked() {
      linkSel.attr('d', d => {
        const [x1, y1] = edgeStart(d.source, d.target);
        const [x2, y2] = edgeEnd(d.source, d.target, 3);
        return `M${x1},${y1}L${x2},${y2}`;
      });
      edgeLabelSel.attr('x', d => (d.source.x + d.target.x) / 2).attr('y', d => (d.source.y + d.target.y) / 2 - 4);
      nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
    }
    sim.on('tick', ticked);

    nodeSel.call(d3.drag()
      .on('start', (event, d) => { if (!event.active) sim.alphaTarget(0.25).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end', (event, d) => { if (!event.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

    const zoom = d3.zoom().scaleExtent([0.4, 3]).on('zoom', e => root.attr('transform', e.transform));
    svg.call(zoom).on('dblclick.zoom', null);
    svg.on('click', () => select(null));

    // 점들이 퍼진 범위를 재서 화면 안에 꼭 맞게 확대·축소한다
    function fitCenter() {
      const { width, height } = svg.node().getBoundingClientRect();
      const pad = 70;
      const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
      const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad;
      const y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
      const scale = Math.min(width / (x1 - x0), height / (y1 - y0), 1.1);
      const tx = width / 2 - scale * (x0 + x1) / 2, ty = height / 2 - scale * (y0 + y1) / 2;
      svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
    }
    // 처음부터 어느 정도 자리를 잡은 상태로 시작한 뒤, 나머지는 천천히 안정시킨다
    sim.stop();
    for (let i = 0; i < 300; i++) sim.tick();
    ticked();
    fitCenter();
    sim.alpha(0.08).restart();
    window.addEventListener('resize', fitCenter);

    // ── 상태에 맞춰 화면 갱신 ───────────────────
    function neighborsOf(id) {
      const set = new Set([id]);
      links.filter(isVisibleLink).forEach(l => {
        if (l.source.id === id) set.add(l.target.id);
        if (l.target.id === id) set.add(l.source.id);
      });
      return set;
    }

    function refresh() {
      const active = state.activeQuery !== null ? new Set(DATA.queries[state.activeQuery].ids) : null;
      const near = state.selected ? neighborsOf(state.selected) : null;
      const focus = active || near;

      linkSel.style('display', d => isVisibleLink(d) ? null : 'none')
        .classed('dim', d => focus && !(focus.has(d.source.id) && focus.has(d.target.id)));
      edgeLabelSel.style('display', d => isVisibleLink(d) && near && d.relation !== 'subClassOf'
        && (d.source.id === state.selected || d.target.id === state.selected) ? null : 'none');

      nodeSel.classed('dim', d => focus && !focus.has(d.id));
      nodeSel.select('.shape')
        .attr('stroke', d => {
          if (active && active.has(d.id)) return '#fafafa';
          if (d.id === state.selected) return '#fafafa';
          if (state.showInferred && hasInferred.has(d.id)) return '#34d399';
          return d.kind === 'class' ? '#52525b' : '#09090b';
        })
        .attr('stroke-width', d => (active && active.has(d.id)) || d.id === state.selected ? 3
          : (state.showInferred && hasInferred.has(d.id)) ? 3 : d.kind === 'class' ? 1.2 : 1.5);

      document.querySelectorAll('.chip').forEach((chip, i) => chip.setAttribute('aria-pressed', String(i === state.activeQuery)));
      document.getElementById('reset').classList.toggle('hidden', state.activeQuery === null);
      document.getElementById('reset').classList.toggle('inline-flex', state.activeQuery !== null);

      const visible = links.filter(isVisibleLink);
      document.getElementById('stat-nodes').textContent = nodes.length;
      document.getElementById('stat-facts').textContent = visible.filter(l => l.status === 'fact').length;
      document.getElementById('stat-inferred').textContent = visible.filter(l => l.status === 'inferred').length;
      renderDetail();
    }

    function select(id) {
      state.selected = id === state.selected ? null : id;
      if (state.selected) state.activeQuery = null;
      refresh();
    }

    // ── 오른쪽 패널: 선택한 점 / 질문 결과 ───────
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function renderDetail() {
      const box = document.getElementById('detail');
      box.replaceChildren();

      if (state.activeQuery !== null) {
        const q = DATA.queries[state.activeQuery];
        box.append(el('div', 'text-xs text-zinc-400', 'SPARQL 질문의 답'));
        box.append(el('div', 'font-semibold mt-1 leading-snug', q.title));
        if (!q.ids.length) box.append(el('div', 'text-sm text-zinc-400 mt-3', '해당하는 점이 없습니다.'));
        const list = el('div', 'mt-3 flex flex-wrap gap-2');
        q.ids.forEach(id => list.append(el('span', 'rounded-full px-3 py-1 text-sm bg-white/10', byId.get(id).label)));
        box.append(list);
        return;
      }

      if (!state.selected) {
        box.append(el('div', 'flex items-center gap-2 text-zinc-400 text-sm leading-relaxed',
          '점을 누르면 그 계정이 어떤 사실과 결론으로 이어지는지 여기에 나옵니다.'));
        return;
      }

      const n = byId.get(state.selected);
      box.append(el('div', 'text-xs text-zinc-400', KIND_TEXT[n.kind]));
      box.append(el('div', 'text-xl font-semibold mt-1', n.label));

      const mine = links.filter(l => isVisibleLink(l) && (l.source.id === n.id || l.target.id === n.id));
      const groups = [['fact', '입력한 사실'], ['inferred', '추론기가 찾아낸 결론'], ['rule', '규칙']];
      groups.forEach(([status, title]) => {
        const rows = mine.filter(l => l.status === status);
        if (!rows.length) return;
        const head = el('div', 'text-xs mt-4 mb-1.5 font-medium', title);
        if (status === 'inferred') head.style.color = 'var(--accent)'; else head.className += ' text-zinc-400';
        box.append(head);
        rows.forEach(l => {
          const row = el('div', 'text-sm leading-relaxed text-zinc-200');
          row.textContent = `${l.source.label}  →  ${REL_TEXT[l.relation]}  →  ${l.target.label}`;
          box.append(row);
        });
      });
      if (!mine.length) box.append(el('div', 'text-sm text-zinc-400 mt-3', '연결된 선이 없습니다.'));
    }

    // ── 왼쪽 조작 ───────────────────────────────
    const queriesBox = document.getElementById('queries');
    DATA.queries.forEach((q, i) => {
      const chip = el('button', 'chip rounded-2xl px-4 py-3 text-sm leading-snug bg-white/[0.04] flex items-start gap-3');
      chip.setAttribute('aria-pressed', 'false');
      const icon = document.createElement('iconify-icon');
      icon.setAttribute('icon', 'solar:magnifer-linear');
      icon.className = 'mt-0.5 text-zinc-400';
      chip.append(icon, el('span', 'flex-1', q.title));
      chip.append(el('span', 'text-xs text-zinc-500 mt-0.5', q.ids.length + '개'));
      chip.addEventListener('click', () => {
        state.activeQuery = state.activeQuery === i ? null : i;
        state.selected = null;
        refresh();
      });
      queriesBox.append(chip);
    });
    document.getElementById('reset').addEventListener('click', () => { state.activeQuery = null; refresh(); });

    const toggle = document.getElementById('toggle-inferred');
    toggle.addEventListener('click', () => {
      state.showInferred = !state.showInferred;
      toggle.setAttribute('aria-checked', String(state.showInferred));
      refresh();
    });

    refresh();
  </script>
</body>
</html>
